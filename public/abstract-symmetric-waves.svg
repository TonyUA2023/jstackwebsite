<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05070B"/>
      <stop offset="100%" stop-color="#0A0D14"/>
    </linearGradient>

    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0096C7" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#05070B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sym-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0096C7" stop-opacity="0.1"/>
      <stop offset="35%" stop-color="#00D4FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="65%" stop-color="#00D4FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0096C7" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="sym-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="sym-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="fill-wave-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0096C7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#05070B" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="fill-wave-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#05070B" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1440" height="900" fill="url(#bg-grad)"/>
  
  <!-- Central Radial Glow -->
  <rect width="1440" height="900" fill="url(#center-glow)"/>

  <!-- Filled Symmetric Ribbons -->
  <path d="M 0,900 L 0,380 C 240,280 480,440 720,380 C 960,440 1200,280 1440,380 L 1440,900 Z" fill="url(#fill-wave-1)" />
  <path d="M 0,900 L 0,510 C 300,420 450,600 720,510 C 990,600 1140,420 1440,510 L 1440,900 Z" fill="url(#fill-wave-2)" />

  <!-- Symmetrical Vector Waves -->
  <!-- Wave 1 (Upper) -->
  <path d="M 0,220 C 240,140 480,300 720,220 C 960,300 1200,140 1440,220" stroke="url(#sym-purple)" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Wave 2 (Glowing Main Wave) -->
  <path d="M 0,310 C 220,200 440,400 720,300 C 1000,400 1220,200 1440,310" stroke="url(#sym-cyan)" stroke-width="3" filter="url(#glow)" />

  <!-- Wave 3 (Secondary Ripple) -->
  <path d="M 0,350 C 260,260 480,440 720,350 C 960,440 1180,260 1440,350" stroke="url(#sym-teal)" stroke-width="1.5" />

  <!-- Wave 4 (Horizon Centerpiece) -->
  <path d="M 0,440 C 280,340 500,520 720,430 C 940,520 1160,340 1440,440" stroke="url(#sym-cyan)" stroke-width="3.5" filter="url(#glow)" />

  <!-- Symmetric Horizontal Wave Mesh Lines -->
  <path d="M 0,470 C 290,370 510,540 720,460 C 930,540 1150,370 1440,470" stroke="url(#sym-purple)" stroke-width="1.2" stroke-opacity="0.7" />
  <path d="M 0,482 C 290,382 510,552 720,472 C 930,552 1150,382 1440,482" stroke="url(#sym-purple)" stroke-width="1.0" stroke-opacity="0.5" />
  <path d="M 0,494 C 290,394 510,564 720,484 C 930,564 1150,394 1440,494" stroke="url(#sym-purple)" stroke-width="0.8" stroke-opacity="0.3" />

  <!-- Wave 5 (Deep Wave) -->
  <path d="M 0,580 C 250,480 480,660 720,570 C 960,660 1190,480 1440,580" stroke="url(#sym-teal)" stroke-width="2" />

  <!-- Wave 6 (Dotted Base Arc) -->
  <path d="M 0,680 C 320,580 520,760 720,670 C 920,760 1120,580 1440,680" stroke="url(#sym-cyan)" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Symmetric Glowing Center Nodes -->
  <circle cx="720" cy="300" r="10" fill="#00D4FF" fill-opacity="0.3" filter="url(#glow)" />
  <circle cx="720" cy="300" r="4" fill="#FFFFFF" />

  <circle cx="720" cy="430" r="12" fill="#00D4FF" fill-opacity="0.35" filter="url(#glow)" />
  <circle cx="720" cy="430" r="5" fill="#FFFFFF" />

  <circle cx="440" cy="400" r="8" fill="#00D4FF" fill-opacity="0.3" filter="url(#glow)" />
  <circle cx="440" cy="400" r="3" fill="#FFFFFF" />

  <circle cx="1000" cy="400" r="8" fill="#00D4FF" fill-opacity="0.3" filter="url(#glow)" />
  <circle cx="1000" cy="400" r="3" fill="#FFFFFF" />
</svg>
