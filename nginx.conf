# HTML is always revalidated, so a fresh deploy never serves pages that point to deleted asset hashes
map $sent_http_content_type $html_cache_control {
    default "";
    ~^text/html "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $html_cache_control;

    # Redirects stay relative, so behind the HTTPS proxy they never point to http:// or port 80
    absolute_redirect off;

    # Static pages (/cotiza, /gracias) resolve to their own index.html; everything else falls back to the SPA
    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    # Hashed build assets and self-hosted fonts never change: cache them for a year
    location ~ ^/(assets|fonts)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Enable Gzip Compression for fast delivery
    gzip on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
